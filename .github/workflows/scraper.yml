name: Mugo Department Scraper

on:
  schedule:
    # Tuesday and Friday at 4:30 AM UTC
    - cron: "30 4 * * 2,5"
  workflow_dispatch:
    inputs:
      skip_model_download:
        description: 'Skip pre-downloading embedding model'
        required: false
        default: false
        type: boolean
      skip_scrape:
        description: 'Skip the scraping step (for testing/debugging)'
        required: false
        default: false
        type: boolean

concurrency:
  group: scraper-mugo
  cancel-in-progress: false

jobs:
  scrape:
    name: Run Mugo Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PyTorch (CPU-only)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install other dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure latest huggingface_hub for reliable downloads (Xet storage support)
          pip install --upgrade huggingface_hub

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/scraper-mugo
          key: huggingface-models-${{ runner.os }}-siglip-v3

      - name: Pre-download embedding model (verify cache integrity)
        if: ${{ inputs.skip_model_download != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_SYMLINKS: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python << 'EOF'
          import os
          import shutil
          import time
          from huggingface_hub import snapshot_download

          cache = os.path.expanduser('~/.cache/scraper-mugo')
          model_cache = os.path.join(cache, 'models--google--siglip-base-patch16-384')
          os.makedirs(cache, exist_ok=True)

          RETRIES = 3
          BACKOFF = 10

          for attempt in range(1, RETRIES + 1):
              print(f'Downloading google/siglip-base-patch16-384 (attempt {attempt}/{RETRIES})...')
              # Clear any partial/corrupted cache before each attempt
              if os.path.isdir(model_cache):
                  shutil.rmtree(model_cache, ignore_errors=True)
                  print(f'  Cleared existing cache at {model_cache}')
              try:
                  snapshot_download(
                      'google/siglip-base-patch16-384',
                      cache_dir=cache,
                  )
                  print('Model downloaded successfully')
                  break
              except Exception as e:
                  print(f'  Attempt {attempt} failed: {e}')
                  if attempt < RETRIES:
                      wait = BACKOFF * attempt
                      print(f'  Retrying in {wait}s...')
                      time.sleep(wait)
                  else:
                      print(f'  All {RETRIES} attempts failed.')
                      exit(1)
          EOF

      - name: Run scraper
        if: ${{ inputs.skip_scrape != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CACHE_DIR: ~/.cache/scraper-mugo
          HF_HUB_DISABLE_SYMLINKS: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          mkdir -p ~/.cache/scraper-mugo
          python -m src.main
